[[rules]]
  id = "whatsapp-gateway-token"
  description = "WhatsApp gateway bearer token"
  regex = '''WHATSAPP_GATEWAY_TOKEN\s*[:=]\s*['"]?[0-9a-f]{64}['"]?'''
  secretGroup = 2

[[rules]]
  id = "generic-api-key"
  description = "Generic API key or secret"
  regex = '''(?i)(api[_-]?key|secret|token|password|passwd|pwd)\s*[:=]\s*['"]?[A-Za-z0-9+/=]{20,}['"]?'''
  secretGroup = 2

[[rules]]
  id = "jwt-secret"
  description = "JWT signing secret"
  regex = '''(?i)JWT_ACCESS_SECRET\s*[:=]\s*['"]?[A-Za-z0-9+/=]{16,}['"]?'''
  secretGroup = 2

[[rules]]
  id = "encryption-key"
  description = "Encryption key"
  regex = '''(?i)(BACKUP_ENCRYPTION_KEY|EVIDENCE_ENCRYPTION_KEY)\s*[:=]\s*['"]?[A-Za-z0-9+/=]{32,}['"]?'''
  secretGroup = 2

[[allowlist]]
  id = "placeholder-values"
  description = "Placeholder example values that are not real secrets"
  regex = '''PASTE_THE_64_CHARACTER_TOKEN|ci-only-secret-value|example\.com|your-secret-here'''
