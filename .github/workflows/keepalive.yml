name: Keep API awake

on:
  schedule:
    # Render's free plan sleeps after 15 idle minutes; ping every 10.
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl --fail --silent --show-error --max-time 90 https://conductnexus-api.onrender.com/api/v1/health
