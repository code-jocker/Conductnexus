services:
  - type: web
    name: conductnexus-api-staging
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: staging
      - key: APP_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "14"
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: BACKUP_ENCRYPTION_KEY
        generateValue: true
      - key: BACKUP_SCHEDULE
        value: "0 2 * * *"
      - key: BACKUP_RETENTION_DAYS
        value: "7"
      - key: ENABLE_WHATSAPP
        value: "false"
      - key: WHATSAPP_SESSION
        value: "conductnexus-staging"
      - key: WHATSAPP_PAIR_PHONE
        sync: false
      - key: WHATSAPP_GATEWAY_URL
        sync: false
      - key: WHATSAPP_GATEWAY_TOKEN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: MAILJET_API_KEY
        sync: false
      - key: MAILJET_API_SECRET
        sync: false
      - key: MAILJET_SENDER
        sync: false
      - key: TWO_FACTOR_RESEND_SECONDS
        value: "60"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: "Staging Administrator"
      - key: SCHOOL_NAME
        sync: false
      - key: ERROR_REPORTING_PROVIDER
        value: "log"

  # Staging WhatsApp gateway — separate persistent disk from production.
  - type: docker
    name: conductnexus-whatsapp-gateway-staging
    plan: starter
    region: frankfurt
    dockerfilePath: whatsapp-gateway/Dockerfile
    disk:
      name: whatsapp-session-staging
      mountPath: /app/storage
      sizeGB: 1
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "3100"
      - key: GATEWAY_TOKEN
        sync: false
      - key: SESSION_DIR
        value: /app/storage/whatsapp-session
      - key: SESSION_NAME
        value: conductnexus-staging
      - key: AUTO_CONNECT
        value: "true"
      - key: RECONNECT_MAX_MS
        value: "120000"
