<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ConductNexus — offline</title>
    <meta name="theme-color" content="#0b1b33" />
    <style>
      :root {
        color-scheme: light dark;
        --navy: #0b1b33;
        --ink: #0f172a;
        --muted: #5b6b83;
        --orange: #d97c3b;
        --canvas: #f5f7fb;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--canvas);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      .card {
        width: min(420px, 100%);
        background: #fff;
        border: 1px solid #dbe3ef;
        border-radius: 18px;
        padding: 28px;
        text-align: center;
        box-shadow: 0 18px 45px -24px rgba(11, 27, 51, 0.45);
      }
      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 16px;
        border-radius: 18px;
        background: linear-gradient(145deg, #2563eb, #0b1b33);
        color: #fff;
        font-weight: 800;
        letter-spacing: 1px;
        display: grid;
        place-items: center;
        font-size: 20px;
      }
      h1 { font-size: 21px; margin: 0 0 8px; }
      p { color: var(--muted); font-size: 14px; line-height: 1.55; margin: 0 0 18px; }
      button, a.button {
        display: inline-block;
        border: 0;
        border-radius: 12px;
        background: #2563eb;
        color: #fff;
        font-weight: 700;
        font-size: 14px;
        padding: 12px 18px;
        cursor: pointer;
        text-decoration: none;
      }
      .hint { margin-top: 18px; font-size: 12px; color: var(--muted); }
      @media (prefers-color-scheme: dark) {
        body { background: #060d19; color: #e8eefb; }
        .card { background: #0d182b; border-color: #1f2f4d; }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark">CN</div>
      <h1>You are offline</h1>
      <p>
        ConductNexus could not reach the server. Incident drafts saved on this device are safe and will sync once the
        connection returns.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
      <p class="hint">
        Incident drafts are available when the app shell loads. Open the app once while online to enable offline
        support on this device.
      </p>
    </main>
  </body>
</html>
