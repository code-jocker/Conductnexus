services:
  - type: web
    name: conductnexus-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    # NODE_ENV=production makes npm ci omit devDependencies, and tsc lives there.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://e-visitors-d4830.web.app
      - key: CORS_ORIGIN
        value: https://e-visitors-d4830.web.app,https://e-visitors-d4830.firebaseapp.com
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "14"
      - key: FIREBASE_PROJECT_ID
        value: e-visitors-d4830
      - key: BACKUP_ENCRYPTION_KEY
        generateValue: true
      - key: BACKUP_SCHEDULE
        value: "0 2 * * *"
      - key: BACKUP_RETENTION_DAYS
        value: "30"
      # Render's free plan has an ephemeral filesystem, so the linked WhatsApp
      # device cannot live here. Keep the in-process browser off and point the
      # API at the always-on gateway in whatsapp-gateway/ instead.
      - key: ENABLE_WHATSAPP
        value: "false"
      - key: WHATSAPP_SESSION
        value: "conductnexus"
      - key: WHATSAPP_PAIR_PHONE
        sync: false
      - key: WHATSAPP_GATEWAY_URL
        sync: false
      - key: WHATSAPP_GATEWAY_TOKEN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # Leave empty so the sender derives from SMTP_USER/GMAIL_USER. Gmail
      # rejects a From address that differs from the authenticated account.
      - key: MAIL_FROM
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      # Mailjet Send API takes precedence over Gmail/SMTP when both keys are set.
      - key: MAILJET_API_KEY
        sync: false
      - key: MAILJET_API_SECRET
        sync: false
      - key: MAILJET_SENDER
        sync: false
      - key: TWO_FACTOR_RESEND_SECONDS
        value: "60"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: SCHOOL_NAME
        sync: false

  # WhatsApp gateway — owns the linked phone and its browser.
  #
  # The free Render plan has an ephemeral filesystem and no Chromium, so the
  # in-process browser cannot live here. This service runs Docker with Chrome
  # baked in and a persistent disk for the session, and the API proxies status
  # and sends through it (see WHATSAPP_GATEWAY_URL / WHATSAPP_GATEWAY_TOKEN).
  - type: docker
    name: conductnexus-whatsapp-gateway
    plan: starter
    region: frankfurt
    dockerfilePath: whatsapp-gateway/Dockerfile
    disk:
      name: whatsapp-session
      mountPath: /app/storage
      sizeGB: 1
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "3100"
      - key: GATEWAY_TOKEN
        sync: false
      - key: SESSION_DIR
        value: /app/storage/whatsapp-session
      - key: SESSION_NAME
        value: conductnexus
      - key: AUTO_CONNECT
        value: "true"
      - key: RECONNECT_MAX_MS
        value: "120000"
