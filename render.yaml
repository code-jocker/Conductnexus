services:
  - type: web
    name: conductnexus-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    # NODE_ENV=production makes npm ci omit devDependencies, and tsc lives there.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://e-visitors-d4830.web.app
      - key: CORS_ORIGIN
        value: https://e-visitors-d4830.web.app,https://e-visitors-d4830.firebaseapp.com
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "14"
      - key: FIREBASE_PROJECT_ID
        value: e-visitors-d4830
      - key: BACKUP_ENCRYPTION_KEY
        generateValue: true
      - key: BACKUP_SCHEDULE
        value: "0 2 * * *"
      - key: BACKUP_RETENTION_DAYS
        value: "30"
      # Render's free plan has an ephemeral filesystem, so the linked WhatsApp
      # device is wiped on every deploy/restart. Leave this false here and run
      # the gateway on a host with a persistent disk, or upgrade to a paid plan
      # with a disk mounted at backend/storage.
      - key: ENABLE_WHATSAPP
        value: "false"
      - key: WHATSAPP_SESSION
        value: "conductnexus"
      - key: WHATSAPP_PAIR_PHONE
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        value: ConductNexus <no-reply@conductnexus.rw>
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: SCHOOL_NAME
        sync: false
